name: Build desktop wrappers

# Mac and Linux binaries can only be compiled on Mac and Linux.
# This does all four on GitHub's machines. On a tag it also publishes a
# release, because a workflow artifact is not a download: it expires,
# and you need a GitHub account to reach it.
# Tag a commit (git tag v1.2.0 && git push origin v1.2.0) or run it by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macos-apple-silicon
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macos-intel
          - os: ubuntu-22.04
            args: ''
            name: linux
          - os: windows-latest
            args: ''
            name: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci || npm install

      - name: Build
        working-directory: desktop
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: baaki-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.msi
          # a silent empty artifact is how you ship nothing and never find out
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p out
          find dist -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          ls -la out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            **The file itself is the product.** Download
            [`baaki.html`](https://github.com/j333t/baaki/raw/${{ github.ref_name }}/baaki.html)
            and double-click it, or just open <https://j333t.github.io/baaki/>.

            The desktop wrappers below are optional. They exist for the three
            things a browser tab cannot do: float above other windows, start
            with the machine, and come back where you left it.

            They are **unsigned**, so the first run gets a warning.
            macOS: right-click the app and choose Open, once.
            Windows SmartScreen: More info, then Run anyway.
